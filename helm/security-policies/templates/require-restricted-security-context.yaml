apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: platform-require-restricted-security-context
spec:
  validationFailureAction: {{ .Values.validationFailureAction }}
  background: true
  rules:
    - name: require-pod-security-context
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - {{ .Values.targetNamespace }}
      validate:
        message: Pods must run as non-root with the RuntimeDefault seccomp profile.
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault

    - name: require-container-hardening
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - {{ .Values.targetNamespace }}
      validate:
        message: Containers must drop Linux capabilities and block privilege escalation.
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  capabilities:
                    drop:
                      - ALL


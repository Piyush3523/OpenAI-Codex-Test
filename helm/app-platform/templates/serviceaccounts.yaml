apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app-platform.fullname" . }}-api
  labels:
    {{- include "app-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app-platform.fullname" . }}-web
  labels:
    {{- include "app-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
automountServiceAccountToken: false


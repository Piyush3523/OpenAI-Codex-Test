apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: platform-disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-fixed-image-tags
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - platform
      validate:
        message: Images must use explicit, non-latest tags.
        pattern:
          spec:
            containers:
              - image: "!*:latest"

